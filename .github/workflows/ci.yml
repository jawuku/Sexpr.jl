name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the supported versions: 1.10 is the LTS, 1.12 the previous release and
        # 1.13 the current one. Older lines are still supported by the package
        # but are end-of-life upstream, so they are not gated here.
        julia-version: ['1.10.14', '1.12.7', '1.13.4']

    steps:
      # both actions run on node24; checkout@v4 and setup-julia@v2 still declare
      # node20, which runners retired on 2026-09-23
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}

      - name: Run tests
        run: julia --project=. test/runtests.jl

      # every version reads its own base/ tree, and the round trip exits nonzero
      # on a failure *or* on any file it did not reach, so this is a full-tree
      # gate on each version rather than a sample
      - name: Round-trip the base/ corpus
        run: julia --project=. test/corpus.jl --budget Inf
